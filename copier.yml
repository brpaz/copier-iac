_min_copier_version: 9.0.0
_subdirectory: template
project_name:
  type: str
  help: What is your project name?
  validator: >-
    {% if not project_name %}
    project_name cannot be empty.
    {% endif %}

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') }}"
  when: false

project_description:
  type: str
  help: A short description of your project.

github_repository:
  type: str
  help: GitHub repository identifier (username/repo-name).
  validator: >-
    {% if not (github_repository | regex_search('^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$')) %}
    github_repository must be in the format 'username/repo-name'.
    {% endif %}

repo_url:
  type: str
  help: The homepage URL for your project.
  default: "https://github.com/{{ github_repository }}"

use_terraform:
  type: bool
  help: Include Terraform to provision infrastructure?
  default: true

use_ansible:
  type: bool
  help: Include a standalone Ansible playbook/role (for configuring hosts independently of Terraform)?
  default: false
  validator: >-
    {% if not use_terraform and not use_ansible %}
    You must select at least one of Terraform or Ansible.
    {% endif %}

ansible_enabled:
  type: bool
  when: false
  default: "{{ use_ansible | lower }}"

use_staging_environment:
  type: bool
  help: Include a staging environment in addition to production?
  default: true
  when: "{{ use_terraform or use_ansible }}"

terraform_backend:
  type: str
  help: Where should Terraform state be stored?
  choices:
    Terraform Cloud: tfc
    S3 (native locking, no DynamoDB needed): s3
    Local (single-user/testing only - CI plan/apply is skipped, see docs): local
  default: tfc
  when: "{{ use_terraform }}"

tfc_organization:
  type: str
  help: Your Terraform Cloud organization name.
  when: "{{ use_terraform and terraform_backend == 'tfc' }}"

terraform_s3_bucket:
  type: str
  help: S3 bucket name for Terraform state (must already exist).
  when: "{{ use_terraform and terraform_backend == 's3' }}"

terraform_s3_region:
  type: str
  help: AWS region of the S3 state bucket.
  default: "us-east-1"
  when: "{{ use_terraform and terraform_backend == 's3' }}"

# Global tasks
_tasks:
  - "git init"
